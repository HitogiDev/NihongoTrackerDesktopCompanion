# Builds signed installers for every system and publishes them as a GitHub
# release, together with the `latest.json` manifest the in-app updater reads
# (`plugins.updater.endpoints` in tauri.conf.json).
#
# To release: bump `version` in src-tauri/tauri.conf.json (and Cargo.toml /
# package.json to match), commit, then push a tag with the same number:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY: the contents of the
# private key whose public half is `plugins.updater.pubkey`. Without it the
# bundles are not signed and no installed copy will accept them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
      app: ${{ steps.notes.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      # GitHub's generated notes, minus the version-bump PRs. The in-app
      # updater shows `app` as plain text (it becomes `notes` in latest.json),
      # so there it is just the PR titles, without authors or links.
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -q .body \
            | { grep -v 'chore: release' || true; } > notes.md
          app=$({ grep '^\* ' notes.md || true; } \
            | { grep -v 'made their first contribution' || true; } \
            | sed -E 's/^\* (.*) by @[^ ]+ in https:[^ ]+$/- \1/')
          {
            echo "tag=$tag"
            echo "app<<NOTES_EOF"
            echo "$app"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  release:
    name: ${{ matrix.name }}
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: Linux
            # hoshidicts needs GCC 14 (<format>, std::ranges::to), which
            # sets the bundles' glibc floor at 2.39.
            os: ubuntu-24.04
            args: ''
          - name: macOS
            # The x86_64 half builds for bundle.macOS.minimumSystemVersion;
            # hoshidicts uses std::filesystem, so that must stay >= 10.15.
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev g++-14
          # hoshidicts uses std::ranges::to, first shipped in GCC 14; 24.04
          # defaults to 13, but its libstdc++ runtime is already 14's.
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14" >> "$GITHUB_ENV"

      - name: Ninja (native game hook)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: NihongoTracker Companion v__VERSION__
          releaseBody: ${{ needs.notes.outputs.app }}
          # Without it the names come from productName, whose space GitHub
          # turns into a dot (`NihongoTracker.Companion_…`).
          assetNamePattern: NihongoTrackerDesktopCompanion_[version]_[arch][setup][ext]
          # Published, not a draft: the updater follows `releases/latest`,
          # which skips drafts and pre-releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The AppImage tauri-action uploaded carries Ubuntu's libwayland, which
  # leaves the window blank on distros with a newer Mesa (see the script).
  # Strips it, signs the new bytes and points latest.json at the new
  # signature. A job of its own, after every build: each tauri-action run
  # rewrites latest.json, and editing it alongside them could lose an entry.
  appimage:
    name: AppImage without libwayland
    needs: [notes, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.notes.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir out && cd out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.AppImage' -p latest.json
          name=$(ls *.AppImage)
          bash ../scripts/appimage-unbundle-wayland.sh "$name"
          rm -f "$name.sig"
          ../node_modules/.bin/tauri signer sign "$name"
          sig=$(cat "$name.sig")
          # Every platform whose download is this AppImage (`linux-x86_64`
          # and `linux-x86_64-appimage`).
          jq --arg name "$name" --arg sig "$sig" \
            '.platforms |= map_values(if (.url | endswith("/" + $name)) then .signature = $sig else . end)' \
            latest.json > latest.fixed.json
          mv latest.fixed.json latest.json
          jq -e --arg sig "$sig" '[.platforms[] | select(.signature == $sig)] | length > 0' latest.json
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$name" "$name.sig" latest.json

  # Puts a "which file do I want" table above the changelog. Only the page
  # changes: latest.json keeps the plain notes the app shows.
  downloads:
    name: Download table
    needs: [notes, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          link() {
            name=$(grep -E "$1" <<<"$assets" | grep -v '\.sig$' | head -n 1)
            [ -n "$name" ] && echo "[\`$name\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name)"
          }
          {
            echo '## Downloads'
            echo
            echo '| System | File |'
            echo '| --- | --- |'
            echo "| Windows 10/11 | $(link 'setup\.exe$') |"
            echo "| macOS 10.15+ (Intel and Apple Silicon) | $(link '\.dmg$') |"
            echo "| Linux, any distro (updates itself) | $(link '\.AppImage$') |"
            echo "| Debian / Ubuntu | $(link '\.deb$') |"
            echo "| Fedora / openSUSE | $(link '\.rpm$') |"
            echo
            echo 'Linux builds need glibc 2.39 or newer (Ubuntu 24.04, Fedora 40). The `.sig` files, `.app.tar.gz` and `latest.json` are for the in-app updater: you do not need to download them.'
            echo
            cat notes.md
          } > body.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
