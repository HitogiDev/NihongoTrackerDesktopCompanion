[package]
name = "nihongo-dict"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Yomitan dictionary lookup for Japanese, over the vendored hoshidicts engine"
publish = false

# Deliberately standalone: no tauri, no app types. The desktop companion depends
# on this crate, and the same crate is meant to back an HTTP service for the web
# texthooker, so nothing here may assume a webview or a Tauri runtime.
[dependencies]
cxx = "1"
lru = "0.12"

[build-dependencies]
cxx-build = "1"
cc = "1"

[[bin]]
name = "dict-probe"
path = "src/bin/dict_probe.rs"

[[bin]]
name = "dict-bench"
path = "src/bin/dict_bench.rs"
