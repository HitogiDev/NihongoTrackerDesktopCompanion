[package]
name = "nt-companion"
version = "0.1.0"
description = "NihongoTracker Desktop Companion"
authors = ["HitogiDev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nt_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-runtime-test = []

[dependencies]
nihongo-dict = { path = "../crates/nihongo-dict" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
# Wayland clipboard through the data-control protocol instead of XWayland.
arboard = { version = "3", features = ["wayland-data-control"] }
regex = "1"
fancy-regex = "0.19.2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono-tz = "0.10"
discord-rich-presence = "1.1.0"

[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "~2.4"
# 2.13+ needs Tauri 2.12; the app is on 2.11.
tauri-plugin-updater = "~2.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

# Screenshots of the game window for mined sentences. Not on Linux: its backend
# links PipeWire and libxcb; `platform::linux_impl` captures through X11 instead.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
