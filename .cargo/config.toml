# Where `cargo test` writes the TypeScript bindings (ts-rs). Relative to the
# repository root, so it works from here and from src-tauri alike.
[env]
TS_RS_EXPORT_DIR = { value = "src/lib/bindings", relative = true }
# Every i64/u64 the UI sees fits in a JS number; `bigint` would not survive JSON.
TS_RS_LARGE_INT = "number"
